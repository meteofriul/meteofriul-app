name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test release API guard
        run: npm run test:release-guard

      - name: Test dependency security and compatibility
        run: npm run test:dependency-security

      - name: Test isolated Android Community QA build
        run: npm run test:android-community-qa-guard

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test backend
        run: python -m unittest discover -s tests -v

      - name: Compile backend
        run: python -m compileall -q app

      - name: Test regional HTTP startup and storage metadata
        working-directory: .
        run: |
          python -B -m unittest discover -s experiments/weather_autonomy -p 'test_cloud_reader*.py' -v
          python -B -m unittest discover -s experiments/weather_autonomy -p 'test_gcs_object_store.py' -v

      - name: Test bounded ICON recovery and verified snapshot identity
        working-directory: .
        run: |
          python -B -m unittest discover -s experiments/weather_autonomy -p 'test_icon_recovery*.py' -v
          python -B -m unittest discover -s experiments/weather_autonomy -p 'test_contract_publisher.py' -k verified_latest_snapshot -v

      - name: Install verified promtool for monitor tests
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/prometheus-3.5.0.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 \
            --output "$archive" https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $archive" | sha256sum --check --strict
          tar -xzf "$archive" --directory "$RUNNER_TEMP" prometheus-3.5.0.linux-amd64/promtool
          promtool="$RUNNER_TEMP/prometheus-3.5.0.linux-amd64/promtool"
          "$promtool" --version
          echo "PROMTOOL=$promtool" >> "$GITHUB_ENV"

      - name: Test ICON-2I monitor and PromQL policies
        working-directory: .
        shell: bash
        env:
          ICON2I_MONITOR_ALLOW_CLOUD: "0"
        run: |
          test -x "$PROMTOOL"
          python -B -m unittest discover -s experiments/weather_autonomy -p 'test_freshness_monitor*.py' -v

  hosting-preview-tool:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets for Android release contracts
        working-directory: frontend
        run: npm run build

      - name: Sync Android project for release contracts
        working-directory: frontend
        run: npx cap sync android

      - name: Test Hosting preview deployment guardrails
        shell: powershell
        run: |
          .\scripts\release-api-preflight.tests.ps1
          pwsh -NoProfile -File .\scripts\android-r8-hardening.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Android R8 hardening contract tests failed" }
          pwsh -NoProfile -File .\scripts\build-play-aab.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 Play AAB contract tests failed" }
          pwsh -NoProfile -File .\scripts\create-play-upload-keystore.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Play upload key bootstrap contract tests failed" }
          .\scripts\audit-play-release-ledger.ps1
          .\scripts\audit-play-notification-cutover.tests.ps1
          .\scripts\firestore-push-ttl-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\firestore-push-ttl-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 TTL contract tests failed" }
          .\scripts\firestore-push-ttl-live-writer-set.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\firestore-push-ttl-live-writer-set.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Live writer set contract tests failed" }
          pwsh -NoProfile -File .\scripts\firestore-community-ttl-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community TTL audit tests failed" }
          pwsh -NoProfile -File .\scripts\firestore-community-ttl-evidence.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community TTL evidence tests failed" }
          .\scripts\cloud-run-runtime-iam-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\cloud-run-runtime-iam-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 Cloud Run IAM contract tests failed" }
          .\scripts\production-job-operations.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\production-job-operations.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 production job operations contract tests failed" }
          .\scripts\community-moderation-runtime-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\community-moderation-runtime-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community moderation runtime contract tests failed" }
          .\scripts\deploy-hosting-preview-rest.contract.tests.ps1
          .\scripts\deploy-hosting-preview-rest.tests.ps1
