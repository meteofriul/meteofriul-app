name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test release API guard
        run: npm run test:release-guard

      - name: Test dependency security and compatibility
        run: npm run test:dependency-security

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test backend
        run: python -m unittest discover -s tests -v

      - name: Compile backend
        run: python -m compileall -q app

  hosting-preview-tool:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets for Android release contracts
        working-directory: frontend
        run: npm run build

      - name: Sync Android project for release contracts
        working-directory: frontend
        run: npx cap sync android

      - name: Test Hosting preview deployment guardrails
        shell: powershell
        run: |
          .\scripts\release-api-preflight.tests.ps1
          pwsh -NoProfile -File .\scripts\android-r8-hardening.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Android R8 hardening contract tests failed" }
          pwsh -NoProfile -File .\scripts\build-play-aab.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 Play AAB contract tests failed" }
          pwsh -NoProfile -File .\scripts\create-play-upload-keystore.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Play upload key bootstrap contract tests failed" }
          .\scripts\audit-play-release-ledger.ps1
          .\scripts\audit-play-notification-cutover.tests.ps1
          .\scripts\firestore-push-ttl-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\firestore-push-ttl-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 TTL contract tests failed" }
          .\scripts\firestore-push-ttl-live-writer-set.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\firestore-push-ttl-live-writer-set.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Live writer set contract tests failed" }
          pwsh -NoProfile -File .\scripts\firestore-community-ttl-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community TTL audit tests failed" }
          pwsh -NoProfile -File .\scripts\firestore-community-ttl-evidence.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community TTL evidence tests failed" }
          .\scripts\cloud-run-runtime-iam-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\cloud-run-runtime-iam-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 Cloud Run IAM contract tests failed" }
          .\scripts\production-job-operations.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\production-job-operations.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 production job operations contract tests failed" }
          .\scripts\community-moderation-runtime-audit.contract.tests.ps1
          pwsh -NoProfile -File .\scripts\community-moderation-runtime-audit.contract.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 community moderation runtime contract tests failed" }
          .\scripts\deploy-hosting-preview-rest.contract.tests.ps1
          .\scripts\deploy-hosting-preview-rest.tests.ps1
