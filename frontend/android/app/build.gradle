import groovy.json.JsonOutput
import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Isolated Android Community QA build. No production Firebase configuration is accepted.
def communityQaRequested = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('communityqa') }
def communityQaConfig = null
if (communityQaRequested) {
    def configPath = project.findProperty('METEO_COMMUNITY_QA_CONFIG')?.toString()
    if (!configPath || System.getenv('METEO_COMMUNITY_QA_BUILD') != '1') throw new GradleException('Community QA protected builder required')
    communityQaConfig = new JsonSlurper().parse(new File(configPath))
    if (communityQaConfig.projectId != 'meteofriul-comm-qa-261016' || communityQaConfig.projectNumber != '445478488139' ||
        communityQaConfig.packageName != 'com.meteofriul.app.communityqa' || !(communityQaConfig.appId ==~ /^1:445478488139:android:[0-9a-f]+$/)) {
        throw new GradleException('Community QA Firebase identity mismatch')
    }
    if (gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('release') || it.toLowerCase(Locale.ROOT).contains('localpilot') || it.toLowerCase(Locale.ROOT).contains('privatetest') || it.toLowerCase(Locale.ROOT).contains('bundle') || it.toLowerCase(Locale.ROOT).contains('install') }) {
        throw new GradleException('Community QA build cannot produce bundles, install or mix other variants')
    }
    if (project.findProperty('METEO_API_BASE') != 'https://community-qa.invalid/api') throw new GradleException('Community QA API binding mismatch')
}


def meteoPlayReleaseProducingTaskName = { String taskName ->
    def normalized = (taskName ?: '').toLowerCase(Locale.ROOT)
    def releaseProducingVerb = [
        'assemble',
        'bundle',
        'sign',
        'package',
        'finalize',
        'publish'
    ].any { normalized.contains(it) }
    normalized.contains('release') && releaseProducingVerb
}

// Opt-in release-equivalent shrinking for the isolated TEST package.
def meteoLocalPilotMinifiedValue = providers.gradleProperty('METEO_LOCAL_PILOT_MINIFIED').getOrElse('false')
if (!(meteoLocalPilotMinifiedValue in ['true', 'false'])) {
    throw new GradleException('METEO_LOCAL_PILOT_MINIFIED must be true or false')
}
def meteoLocalPilotMinified = meteoLocalPilotMinifiedValue == 'true'

def meteoAndroidLocalPilotTaskName = { String taskName ->
    (taskName ?: '').toLowerCase(Locale.ROOT).contains('localpilot')
}

def meteoReadGoogleServicesIdentity = { File servicesFile ->
    if (!servicesFile.exists() || !servicesFile.isFile()) {
        throw new GradleException('Play release requires app/google-services.json')
    }
    def payload
    try {
        payload = new JsonSlurper().parse(servicesFile)
    } catch (Exception ignored) {
        throw new GradleException('Play release google-services.json is not valid JSON')
    }
    def matchingClients = (payload.client ?: []).findAll {
        it?.client_info?.android_client_info?.package_name == 'com.meteofriul.app'
    }
    if (matchingClients.size() != 1) {
        throw new GradleException(
            'Play release google-services.json must contain exactly one com.meteofriul.app client'
        )
    }
    [
        projectId: payload?.project_info?.project_id?.toString(),
        projectNumber: payload?.project_info?.project_number?.toString(),
        applicationId: matchingClients[0].client_info.android_client_info.package_name.toString(),
        firebaseAppId: matchingClients[0].client_info.mobilesdk_app_id?.toString()
    ]
}

def privateTestKeystorePropertiesFile = rootProject.file('keystore.properties')
def privateTestKeystoreProperties = new Properties()
def playKeystorePropertiesFile = rootProject.file('play-keystore.properties')
def playKeystoreProperties = new Properties()
def meteoBackgroundApiBase = (
    project.findProperty('METEO_API_BASE') ?:
    'https://cfweb-bcee09e---meteofriul-api-bx24xqvcda-ew.a.run.app/api'
).toString()
if (!(meteoBackgroundApiBase ==~ /^https:\/\/[A-Za-z0-9.-]+(?::\d+)?\/api$/)) {
    throw new GradleException('METEO_API_BASE must be an absolute HTTPS /api endpoint')
}
if (privateTestKeystorePropertiesFile.exists()) {
    privateTestKeystorePropertiesFile.withInputStream {
        privateTestKeystoreProperties.load(it)
    }
}
if (playKeystorePropertiesFile.exists()) {
    playKeystorePropertiesFile.withInputStream {
        playKeystoreProperties.load(it)
    }
}

