// The side-by-side local-pilot package deliberately has no Firebase Android
// identity. Keep the production google-services.json intact and skip only the
// generated task for this isolated build type; foreground official-alert data
// still comes from the normal HTTPS API.
tasks.configureEach { task ->
    def normalized = task.name.toLowerCase(Locale.ROOT)
    if ((normalized.contains('localpilot') || normalized.contains('communityqa')) && normalized.contains('googleservices')) {
        task.enabled = false
    }
}
