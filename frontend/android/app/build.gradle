tasks.register('verifyLocalPilotBuildMode') {
    group = 'verification'
    description = 'Checks the resolved TEST optimization mode and package/signing isolation.'
    doLast {
        def pilot = android.buildTypes.getByName('localPilot')
        def production = android.buildTypes.getByName('release')
        if (pilot.applicationIdSuffix != '.localpilot' || pilot.signingConfig != android.signingConfigs.debug) {
            throw new GradleException('Local TEST package or signing isolation changed')
        }
        if (pilot.minifyEnabled != meteoLocalPilotMinified ||
            pilot.shrinkResources != meteoLocalPilotMinified ||
            pilot.debuggable == meteoLocalPilotMinified) {
            throw new GradleException('Local TEST optimization mode does not match the requested mode')
        }
        if (!production.minifyEnabled || !production.shrinkResources || production.debuggable) {
            throw new GradleException('Production optimization configuration changed')
        }
        println 'METEO_LOCAL_PILOT_MINIFIED:' + meteoLocalPilotMinified
    }
}
tasks.configureEach { task ->
    if (task.name == 'preLocalPilotBuild') {
        task.dependsOn('verifyLocalPilotBuildMode')
    }
}

tasks.register('printPlayReleaseIdentity') {
    group = 'verification'
    description = 'Prints the declared Play application/version identity without producing an artifact.'
    doLast {
        println 'METEO_PLAY_RELEASE_IDENTITY:' + JsonOutput.toJson([
            ApplicationId: android.defaultConfig.applicationId,
            VersionCode: android.defaultConfig.versionCode,
            VersionName: android.defaultConfig.versionName
        ])
    }
}

tasks.register('verifyPlayReleaseGuardTaskClassification') {
    group = 'verification'
    description = 'Behaviorally checks which task names are protected by the Play release guard.'
    doLast {
        [
            assembleRelease: true,
            bundleRelease: true,
            signReleaseBundle: true,
            packageReleaseBundle: true,
            finalizeBundleReleaseResources: true,
            publishReleaseBundle: true,
            compileReleaseJavaWithJavac: false,
            assembleDebug: false,
            assembleLocalPilot: false,
            printPlayReleaseIdentity: false,
            verifyPlayReleaseGuardTaskClassification: false
        ].each { taskName, expected ->
            def actual = meteoPlayReleaseProducingTaskName(taskName)
            if (actual != expected) {
                throw new GradleException(
                    "Play release guard classification mismatch for ${taskName}: " +
                    "expected=${expected} actual=${actual}"
                )
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    // Check resolved tasks too: Gradle abbreviations and aggregate tasks must
    // not bypass the explicit QA builder or mix package variants.
    def qaTasks = graph.allTasks.findAll {
        it.project == project && it.name.toLowerCase(Locale.ROOT).contains('communityqa')
    }
    if (!qaTasks.isEmpty()) {
        if (!communityQaRequested || communityQaConfig == null) {
            throw new GradleException('Community QA resolved tasks require the protected explicit builder')
        }
        def unsafeQaGraph = graph.allTasks.any {
            if (it.project != project) return false
            def name = it.name.toLowerCase(Locale.ROOT)
            name.contains('install') || name.contains('bundle') ||
                ['release', 'localpilot', 'privatetest', 'debug'].any { name.contains(it) }
        }
        if (unsafeQaGraph) {
            throw new GradleException('Community QA resolved tasks cannot install, bundle or mix variants')
        }
    }
    def localPilotRequested = graph.allTasks.any {
        it.project == project && meteoAndroidLocalPilotTaskName(it.name)
    }
    def privateTestRequested = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('privatetest')
    }
    if (privateTestRequested && !privateTestKeystorePropertiesFile.exists()) {
        throw new GradleException(
            'Private-test signing is not configured. Create the ignored android/keystore.properties first.'
        )
    }
    if (privateTestRequested && !project.hasProperty('METEO_API_BASE')) {
        throw new GradleException(
            'Private-test builds require an explicit -PMETEO_API_BASE=https://<tagged-host>/api'
        )
    }
    def playReleaseRequested = graph.allTasks.any {
        it.project == project && meteoPlayReleaseProducingTaskName(it.name)
    }
    if (localPilotRequested && playReleaseRequested) {
        throw new GradleException(
            'Android local-pilot and Play release tasks are mutually exclusive.'
        )
    }
    if (localPilotRequested) {
        def markerProperty = project.findProperty(
            'METEO_ANDROID_LOCAL_PILOT_GUARD_MARKER'
        )?.toString()
        def markerEnvironment = System.getenv('METEO_ANDROID_LOCAL_PILOT_GUARD_MARKER')
        if (
            !(markerProperty ==~ /^[0-9a-f]{64}$/) ||
            markerProperty != markerEnvironment
        ) {
            throw new GradleException(
                'Android local-pilot tasks require the protected build script marker.'
            )
        }
        if (!project.hasProperty('METEO_API_BASE')) {
            throw new GradleException(
                'Android local-pilot builds require an explicit HTTPS -PMETEO_API_BASE.'
            )
        }
    }
    if (playReleaseRequested) {
        def markerProperty = project.findProperty('METEO_PLAY_RELEASE_GUARD_MARKER')?.toString()
        def markerEnvironment = System.getenv('METEO_PLAY_RELEASE_GUARD_MARKER')
        if (
            !(markerProperty ==~ /^[0-9a-f]{64}$/) ||
            markerProperty != markerEnvironment
        ) {
            throw new GradleException(
                'Play release-producing tasks require the protected build script marker.'
            )
        }
        if (!playKeystorePropertiesFile.exists() || !playKeystorePropertiesFile.isFile()) {
            throw new GradleException(
                'Play signing is not configured. Create the ignored android/play-keystore.properties first.'
            )
        }
        def missingSigningProperties = [
            'storeFile',
            'storePassword',
            'keyAlias',
            'keyPassword'
        ].findAll { key ->
            !playKeystoreProperties[key]?.toString()?.trim()
        }
        if (!missingSigningProperties.isEmpty()) {
            throw new GradleException(
                'Play signing configuration is incomplete: ' + missingSigningProperties.join(', ')
            )
        }
        def resolvedPlayStoreFile = rootProject.file(
            playKeystoreProperties['storeFile'].toString()
        )
        if (!resolvedPlayStoreFile.exists() || !resolvedPlayStoreFile.isFile()) {
            throw new GradleException('Play upload keystore file does not exist.')
        }
        if (!project.hasProperty('METEO_API_BASE')) {
            throw new GradleException(
                'Play release builds require an explicit -PMETEO_API_BASE=https://<tagged-host>/api'
            )
        }
        def requiredReleaseProperties = [
            METEO_PLAY_RELEASE_EXPECTED_APPLICATION_ID: 'com.meteofriul.app',
            METEO_PLAY_RELEASE_EXPECTED_FIREBASE_APP_ID:
                '1:49007668366:android:725bf6f8b339177a852ddf',
            METEO_PLAY_RELEASE_EXPECTED_FIREBASE_PROJECT: 'meteo-friul',
            METEO_PLAY_RELEASE_EXPECTED_FIREBASE_PROJECT_NUMBER: '49007668366'
        ]
        requiredReleaseProperties.each { propertyName, expectedValue ->
            def actualValue = project.findProperty(propertyName)?.toString()
            if (actualValue != expectedValue) {
                throw new GradleException(
                    "Play release property ${propertyName} is missing or does not match."
                )
            }
        }
        def firebaseIdentity = meteoReadGoogleServicesIdentity(file('google-services.json'))
        if (
            firebaseIdentity.projectId !=
                requiredReleaseProperties.METEO_PLAY_RELEASE_EXPECTED_FIREBASE_PROJECT ||
            firebaseIdentity.projectNumber !=
                requiredReleaseProperties.METEO_PLAY_RELEASE_EXPECTED_FIREBASE_PROJECT_NUMBER ||
            firebaseIdentity.applicationId !=
                requiredReleaseProperties.METEO_PLAY_RELEASE_EXPECTED_APPLICATION_ID ||
            firebaseIdentity.firebaseAppId !=
                requiredReleaseProperties.METEO_PLAY_RELEASE_EXPECTED_FIREBASE_APP_ID
        ) {
            throw new GradleException(
                'Play release google-services.json does not match the approved Firebase Android app.'
            )
        }
    }
}

